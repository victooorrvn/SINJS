<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : permet d'étendre le contenu jusque sous l'encoche / la barre d'heure -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Teinte la barre d'adresse / barre de statut en noir (Chrome Android + Safari iOS) -->
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark light">

  <!-- Rend l'app installable en plein écran depuis "Ajouter à l'écran d'accueil" (iOS) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Surveillant de Nuit - INJS</title>

  <style>
    /* Fond noir garanti à TOUS les niveaux : html, body, et même
       la zone visible avant chargement complet du CSS */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Conteneur qui prend TOUTE la hauteur visible, y compris sous
       l'encoche / la barre d'heure grâce aux safe-area-inset */
    .iframe-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Étend la zone noire visible jusque sous les zones système */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      background-color: #121212;
      box-sizing: border-box;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #121212;
    }
  </style>
</head>
<body>

  <div class="iframe-wrapper">
    <!--
      ⚠️ REMPLACE L'URL CI-DESSOUS PAR TON URL DE DÉPLOIEMENT APPS SCRIPT
      (celle qui se termine par /exec, récupérée via "Déployer > Gérer les déploiements")
    -->
    <iframe
      src="https://script.google.com/macros/s/AKfycbwXVycPzuBabN02QLFDyJB5PENg2McGrrWZRriH1RQ718qfPFYoiJLJad-FBEOY5F4N/exec"
      title="Surveillant de Nuit - INJS"
      allow="clipboard-write"
    ></iframe>
  </div>

</body>
</html>
